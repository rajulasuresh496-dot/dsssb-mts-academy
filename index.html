
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSSSB MTS Academy</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f5fa;
  color: #172b4d;
}
header {
  background: #17345f;
  color: white;
  padding: 25px 15px;
  text-align: center;
}
main {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 18px;
  margin: 12px 0;
  border-radius: 14px;
  box-shadow: 0 2px 8px #0001;
}
button {
  background: #2864c5;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 9px;
  font-size: 15px;
}
h2 { color: #17345f; }
</style>
</head>
<body>

<header>
  <h1>DSSSB MTS ACADEMY</h1>
  <p>నా లక్ష్యం 170+ మార్కులు</p>
  <p>Telugu Medium Preparation</p>
</header>

<main>
  <div class="card">
    <h2>📚 Study Room</h2>
    <p>తెలుగులో అన్ని subjects నేర్చుకోండి.</p>
    <button onclick="alert('Lessons coming soon!')">
      Start Learning
    </button>
  </div>

  <div class="card">
    <h2>📄 PYQ Room</h2>
    <p>Previous Year Questions practice.</p>
    <button onclick="alert('Verified PYQs will be added here!')">
      Open PYQs
    </button>
  </div>

  <div class="card">
    <h2>⏱️ Mock Tests</h2>
    <p>Practice tests and exam preparation.</p>
    <button onclick="startTest()">
      Start Test
    </button>
  </div>

  <div class="card">
    <h2>📊 My Progress</h2>
    <p id="progress">Your preparation starts today!</p>
  </div>
</main>

<script>
function startTest() {
  alert("Your first mock test will be added soon!");
}
</script>

</body>
</html>
